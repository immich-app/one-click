
services:
  caddy:
    container_name: immich_caddy
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    depends_on:
      - immich-server
    ports:
      - 443:443
      - 80:80
    volumes:
      - ${CADDY_LOCATION:-./caddy}/Caddyfile:/etc/caddy/Caddyfile
      - ${CADDY_LOCATION:-./caddy}/caddy_conf:/config
      - ${CADDY_LOCATION:-./caddy}/caddy_data:/data
    restart: always
